async function confirmAddPart(){let m=document.getElementById('partModal'),pw=m.querySelector('.new-pw').value; if(pw!==QUALITY_PW){alert('Contraseña incorrecta');return} let p={part:m.querySelector('.new-part').value.trim(),name:m.querySelector('.new-name').value.trim(),model:m.querySelector('.new-model').value.trim(),spec:m.querySelector('.new-spec').value.trim(),category:m.querySelector('.new-cat').value.trim()||'Otros',createdAt:firebase.firestore.FieldValue.serverTimestamp()}; if(!p.part||!p.name){alert('Part# y Nombre son requeridos');return} let ref=await db.collection('bom_partes_extra').add(p); p.id=ref.id; _extraParts.unshift(p); let src=m.dataset.src; if(_ppk[src])_ppk[src].pick(p); closePartModal()}
function compressImage(input,max=850000){return new Promise((resolve)=>{if(!input.files||!input.files[0])return resolve(null);let f=input.files[0],r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),maxSide=900,w=img.width,h=img.height;if(w>h&&w>maxSide){h=Math.round(h*maxSide/w);w=maxSide}else if(h>=w&&h>maxSide){w=Math.round(w*maxSide/h);h=maxSide}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.7,data=c.toDataURL('image/jpeg',q);while(data.length>max&&q>.22){q-=.1;data=c.toDataURL('image/jpeg',q)}resolve(data)};img.src=e.target.result};r.readAsDataURL(f)})}
function previewPhoto(input,id='photo-prev',lbl='photo-lbl'){if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{let img=document.getElementById(id);img.src=e.target.result;img.style.display='block';document.getElementById(lbl).style.display='none'};r.readAsDataURL(input.files[0])}}
function showPhoto(src){document.getElementById('photoImg').src=src;document.getElementById('photoOverlay').classList.add('on')}
function partPickerHtml(id,label){return `<label class="flbl">${label}</label><div class="ppk-wrap" id="${id}-wrap"><span class="ppk-search-icon">🔍</span><input class="ppk-search" type="text" placeholder="Buscar por modelo, nombre o Part#..."><div class="ppk-dropdown"></div><input type="hidden" id="${id}-partno"><input type="hidden" id="${id}-partname"><input type="hidden" id="${id}-model"></div><div class="ppk-card"><span class="ppk-card-no"></span><span class="ppk-card-nm"></span><span class="ppk-card-mdl"></span><button class="ppk-card-x">✕</button></div>`}
function commonModals(){return `<div class="overlay" id="photoOverlay" onclick="this.classList.remove('on')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-hdr"><span>Foto / 사진</span><button onclick="photoOverlay.classList.remove('on')">✕</button></div><div class="modal-body"><img id="photoImg" style="width:100%;border-radius:8px"></div></div></div><div class="overlay" id="partModal"><div class="modal"><div class="modal-hdr"><span>➕ Nueva Parte · 신규 부품 등록</span><button onclick="closePartModal()">✕</button></div><div class="modal-body form-grid"><div><label class="flbl">No. Parte *</label><input class="finp new-part"></div><div><label class="flbl">Nombre *</label><input class="finp new-name"></div><div><label class="flbl">Modelo</label><input class="finp new-model"></div><div><label class="flbl">Categoría</label><input class="finp new-cat"></div><div class="fg-full"><label class="flbl">SPEC</label><input class="finp new-spec"></div><div class="fg-full"><label class="flbl">Contraseña Calidad *</label><input class="finp new-pw" type="password"></div></div><div class="modal-footer"><button class="btn" onclick="closePartModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmAddPart()">Guardar</button></div></div></div>`}
function header(active,title,sub){return `<div class="topbar"><div class="logo">HPM</div><div class="topbar-title">${title}</div><div class="topbar-sub">· ${sub}</div><div class="sp"></div><div class="topbar-clock" id="clock"></div><div class="lang-btn"><button class="lang-opt" id="lang-es" onclick="setLang('es')">ES</button><button class="lang-opt" id="lang-ko" onclick="setLang('ko')">한국어</button></div></div><div class="nav"><a href="01_dashboard.html" class="${active==='dash'?'active':''}">📊 Dashboard</a><a href="02_ncr.html" class="${active==='ncr'?'active':''}">🔴 NCR <span class="nav-badge" id="nb-ncr">0</span></a><a href="03_inspeccion.html" class="${active==='insp'?'active':''}">✅ Inspección <span class="nav-badge blue" id="nb-insp">0</span></a><a href="04_cuarentena.html" class="${active==='quar'?'active':''}">🔶 Cuarentena <span class="nav-badge amber" id="nb-quar">0</span></a></div>`}
</script><script>document.write(header('insp','Inspección de Recibo','Incoming Inspection'))</script><div class="wrap"><div class="kpi-row"><div class="kpi" style="--kc:var(--blue)"><div class="kpi-lbl">Total Registros</div><div class="kpi-val" id="k-total">—</div></div><div class="kpi" style="--kc:var(--green)"><div class="kpi-lbl">OK</div><div class="kpi-val" id="k-ok">—</div></div><div class="kpi" style="--kc:var(--red)"><div class="kpi-lbl">NOK</div><div class="kpi-val" id="k-nok">—</div></div><div class="kpi" style="--kc:var(--green)"><div class="kpi-lbl">Tasa OK</div><div class="kpi-val" id="k-rate">—</div></div><div class="kpi" style="--kc:var(--amber)"><div class="kpi-lbl">Piezas Totales</div><div class="kpi-val" id="k-qty">—</div></div></div><div class="two-col"><div class="sec"><div class="sec-hdr"><div class="sec-title">✅ Nuevo Registro</div></div><div class="sec-body"><div class="form-grid"><div class="fg-full"><script>document.write(partPickerHtml('ppk-i','No. Parte / Nombre'))</script></div><div><label class="flbl">Cantidad</label><input class="finp" type="number" id="i-qty"></div><div><label class="flbl">Lote</label><input class="finp" id="i-lot"></div><div><label class="flbl">Doc. Proveedor</label><input class="finp" id="i-doc" placeholder="Certificado / NA"></div><div><label class="flbl">Inspector</label><input class="finp" id="i-inspector"></div><div><label class="flbl">Resultado</label><select class="fsel" id="i-result"><option>OK</option><option>NOK</option></select></div><div class="fg-full"><label class="flbl">Observaciones</label><input class="finp" id="i-remark"></div></div><div style="margin-top:16px;display:flex;gap:10px"><button class="btn btn-primary" onclick="saveInsp()">Guardar</button><button class="btn" onclick="resetForm()">Limpiar</button></div></div></div><div class="sec"><div class="sec-hdr"><div class="sec-title">Distribución</div></div><div class="sec-body"><div class="chart-box"><canvas id="chartRes"></canvas></div><div class="qr-panel"><div id="qr-insp"></div><div class="kpi-sub">QR Inspección</div></div></div></div></div><div class="sec"><div class="sec-hdr"><div class="sec-title">Historial de Inspección</div><div class="sec-sp"></div><select class="fsel" id="filter" onchange="renderAll()" style="width:140px"><option value="all">Todos</option><option>OK</option><option>NOK</option></select><input class="finp" id="search" oninput="renderAll()" placeholder="Buscar..." style="width:190px"></div><div class="sec-body"><div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>No. Parte</th><th>Lote</th><th>Qty</th><th>Doc</th><th>Inspector</th><th>Resultado</th><th>Obs.</th><th>Acc.</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div><div class="sync-bar"><span class="spinner" id="syncSpinner"></span><span id="syncMsg">Conectando...</span></div><script>document.write(commonModals())</script><script>
const I18N={es:{},ko:{}};let _cache=[],_chart=null;function resetForm(){_ppk['ppk-i']?.reset();['i-qty','i-lot','i-doc','i-inspector','i-remark'].forEach(id=>document.getElementById(id).value='');document.getElementById('i-result').value='OK'}async function saveInsp(){let p=_ppk['ppk-i']?.get();if(!p){alert('Selecciona una parte');return}let rec={date:today(),partNo:p.part,partName:p.name,model:p.model||'',qty:parseInt(document.getElementById('i-qty').value)||0,lot:document.getElementById('i-lot').value.trim(),doc:document.getElementById('i-doc').value.trim()||'NA',inspector:document.getElementById('i-inspector').value.trim(),result:document.getElementById('i-result').value,remark:document.getElementById('i-remark').value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection('inspeccion').add(rec);resetForm();setSyncStatus('✅ Guardado')}async function deleteInsp(id){if(confirm('¿Eliminar registro?'))await db.collection('inspeccion').doc(id).delete()}function renderAll(){let ok=_cache.filter(r=>r.result==='OK').length,nok=_cache.filter(r=>r.result==='NOK').length,total=_cache.length,qty=_cache.reduce((a,r)=>a+(r.qty||0),0),rate=total?Math.round(ok/total*100):0;setText('k-total',total);setText('k-ok',ok);setText('k-nok',nok);setText('k-rate',rate+'%');setText('k-qty',qty.toLocaleString());setText('nb-insp',total);let f=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();let d=_cache.filter(r=>(f==='all'||r.result===f)&&[r.partName,r.partNo,r.lot,r.inspector].join(' ').toLowerCase().includes(q));tbody.innerHTML=d.length?d.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.partName}</td><td class="mono">${r.partNo}</td><td>${r.lot||'—'}</td><td>${(r.qty||0).toLocaleString()}</td><td>${r.doc||'NA'}</td><td>${r.inspector||'—'}</td><td><span class="badge ${r.result==='OK'?'b-ok':'b-nok'}">${r.result}</span></td><td>${r.remark||'—'}</td><td><button class="btn btn-sm btn-red" onclick="deleteInsp('${r.id}')">🗑</button></td></tr>`).join(''):'<tr><td colspan="10" class="empty">Sin registros</td></tr>';if(_chart)_chart.destroy();_chart=new Chart(chartRes,{type:'doughnut',data:{labels:['OK','NOK'],datasets:[{data:[ok,nok],backgroundColor:['#2e7d32','#c62828'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}})}function load(){new QRCode(document.getElementById('qr-insp'),{text:APP_BASE+'03_inspeccion.html',width:90,height:90});db.collection('inspeccion').orderBy('createdAt','desc').onSnapshot(s=>{_cache=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();setSyncStatus('✅ Sincronizado')});db.collection('ncr').where('status','==','Abierto').onSnapshot(s=>setText('nb-ncr',s.size));db.collection('cuarentena').onSnapshot(s=>setText('nb-quar',s.docs.filter(d=>!d.data().disposition).length))}tick();setInterval(tick,30000);setLang(lang,false);loadExtraParts().then(()=>{ppkInit('ppk-i');load()});
</script></body></html>
